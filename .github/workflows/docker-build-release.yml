name: "docker build release"

# 仅由 sync-from-upstream.yml 在版本号更新后显式 dispatch 触发，
# 不在 push 上触发，避免「版本提交 + dispatch」重复构建两遍
on:
  workflow_dispatch:

env:
  PROJECT: frps

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.5

      - name: Set tag
        id: tag
        run: |
          # Dockerfile 里版本写在 ARG VERSION=0.80.7（ENV VERSION ${VERSION} 只是透传）
          VERSION=$(sed -n 's/^ARG VERSION=//p' Dockerfile | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Cannot find VERSION in Dockerfile, fallback to date"
            VERSION="$(date +%Y)-$(date +%m)-$(date +%d)"
          fi
          echo "tag=$VERSION" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push to docker hub
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # laosan-xx/frp 已私有，构建下载 release 包需要令牌；
          # 用 BuildKit secret 传入，不会像 build-arg 那样留在镜像历史里
          secrets: |
            FRP_PAT=${{ secrets.FRP_PAT }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}:${{ env.tag }}

      - name: Sync README.md to Docker Hub
        uses: ms-jpq/sync-dockerhub-readme@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ secrets.DOCKER_USERNAME }}/${{ env.PROJECT }}
          readme: "./README.md"


name: Sync frp version

on:
  schedule:
    - cron: '0 6,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # laosan-xx/frp 已私有：访问该仓库的步骤都需要带读取权限的 PAT
      FRP_PAT: ${{ secrets.FRP_PAT }}
    outputs:
      updated: ${{ steps.update.outputs.updated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest release tag from laosan-xx/frp
        id: upstream
        run: |
          # laosan-xx/frp 已设为私有仓库：匿名 API 会 404，必须用 FRP_PAT 鉴权
          if [ -z "$FRP_PAT" ]; then
            echo "ERROR: FRP_PAT is empty, cannot read private repo laosan-xx/frp!"
            echo "请在仓库 Settings → Secrets and variables → Actions 中添加 FRP_PAT（需有 laosan-xx/frp 读取权限）"
            exit 1
          fi

          TAG=$(curl -fsSL \
            -H "Authorization: Bearer $FRP_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/laosan-xx/frp/releases/latest" | jq -r '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to get upstream release tag"
            exit 1
          fi

          # Strip leading 'v' to get plain version (e.g. 0.70.21)
          PKG_VERSION="${TAG#v}"
          echo "Upstream tag: $TAG -> PKG_VERSION=$PKG_VERSION"

          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version in project files
        id: update
        run: |
          NEW_VERSION="${{ steps.upstream.outputs.PKG_VERSION }}"
          # Dockerfile 现在是 ARG VERSION=0.80.7，ENV VERSION ${VERSION} 只是把 ARG 透传给容器
          CURRENT_VERSION=$(sed -n 's/^ARG VERSION=//p' Dockerfile | head -n 1)

          if [ -z "$CURRENT_VERSION" ]; then
            echo "Cannot find version in Dockerfile (pattern: ^ARG VERSION=)"
            exit 1
          fi

          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date (v${CURRENT_VERSION})"
          else
            # Dockerfile: ARG VERSION=0.80.7
            sed -i "s/^ARG VERSION=.*/ARG VERSION=${NEW_VERSION}/" Dockerfile
            # 安装脚本: FRP_VERSION=${FRP_VERSION:-0.80.7}（保留默认值写法，允许环境变量覆盖）
            sed -i 's|^FRP_VERSION=.*|FRP_VERSION=${FRP_VERSION:-'"${NEW_VERSION}"'}|' frps_linux_install.sh
            # 卸载脚本: FRP_VERSION=0.80.7
            sed -i "s/^FRP_VERSION=.*/FRP_VERSION=${NEW_VERSION}/" frps_linux_uninstall.sh
            # README.md: `FRP_VERSION=0.70.21`
            sed -i "s/FRP_VERSION=[0-9.]*/FRP_VERSION=${NEW_VERSION}/g" README.md

            # 确保文件以换行结尾，避免引入「末尾换行」这种隐藏改动，
            # 否则 cherry-pick 到其它分支时会因上下文不匹配而冲突
            for f in Dockerfile frps_linux_install.sh frps_linux_uninstall.sh README.md; do
              [ -z "$(tail -c1 "$f")" ] || echo >> "$f"
            done

            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Updated: v${CURRENT_VERSION} -> v${NEW_VERSION}"
          fi

      - name: Commit and push to master
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile frps_linux_install.sh frps_linux_uninstall.sh README.md
          git commit -m "chore: bump to v${{ steps.upstream.outputs.PKG_VERSION }}"
          git push origin master

      - name: Trigger docker build release
        if: steps.update.outputs.updated == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/docker-build-release.yml/dispatches" \
            -d '{"ref":"master"}'
